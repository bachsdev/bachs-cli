name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # gives it one commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The npm that ships with Node does not know about trusted publishing.
      # Support landed in 11.5.1, and without it the publish falls back to
      # looking for a token and fails.
      - run: npm install -g npm@latest

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Which tag this release is for. goreleaser otherwise works the
          # version out from git history, and when two tags sit on the same
          # commit it can pick the wrong one. That is the normal case here:
          # rehearse with v0.2.4-rc.1, then release the same commit as v0.2.4.
          # Without this it built the rc again, treated the release as a
          # prerelease, and skipped Homebrew and Scoop.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Writes the release here, and the cask and manifest to
          # bachsdev/homebrew-bachs and bachsdev/scoop-bachs. Those are other
          # repos, so the token handed to a job by default cannot reach them
          # and this has to be a PAT with write access to all three.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      # goreleaser's own after-hooks are a Pro feature, so npm is published
      # here, from the binaries goreleaser left in dist/.
      #
      # A prerelease goes out under npm's `next` tag, so a plain
      # `npm install` still gets the last real version. That is what makes an
      # -rc tag a safe rehearsal.
      - name: Publish to npm
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            scripts/publish-npm.sh "$version" --next
          else
            scripts/publish-npm.sh "$version"
          fi
