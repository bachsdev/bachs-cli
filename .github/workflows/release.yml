name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # gives it one commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The npm that ships with Node does not know about trusted publishing.
      # Support landed in 11.5.1, and without it the publish falls back to
      # looking for a token and fails.
      - run: npm install -g npm@latest

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Writes the release here, and the cask and manifest to
          # bachsdev/homebrew-bachs and bachsdev/scoop-bachs. Those are other
          # repos, so the token handed to a job by default cannot reach them
          # and this has to be a PAT with write access to all three.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
