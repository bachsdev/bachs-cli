name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # The release publishes six npm packages by running this. A typo in it
      # surfaces at release time otherwise, half way through publishing.
      - run: bash -n scripts/publish-npm.sh

      # Catches a config error before a tag does. A Pro-only field parses
      # nowhere and fails the release at second zero, with the tag spent.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
