# Release pipeline for the bachs CLI.
#
# One codebase, every platform and package manager. This is the reason the CLI
# is Go rather than Python: `pip install` reaches PyPI and nothing else, and
# requires the user to already have a matching Python. A single static binary
# reaches Homebrew, apt, yum, Scoop, Docker and a curl script, and needs no
# runtime at all — which matters because most merchants are not Python shops.
#
# Cut a release by pushing a tag. The release workflow runs goreleaser from
# there — not from a laptop, because npm will only hand a publish credential to
# a workflow. See .github/workflows/release.yml.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0

version: 2

project_name: bachs

before:
  hooks:
    - go mod tidy

# npm is published from the binaries built above, not built separately, and
# goes out as `latest` like the Homebrew cask and the Scoop manifest.
#
# It was the one channel with no step here: published by hand once at v0.1.0,
# then three releases behind, handing Node developers a build with no
# `bachs login`. A step only npm needs somebody to remember is how that
# happened, so there isn't one.
after:
  hooks:
    - ./scripts/publish-npm.sh {{ .Version }}

builds:
  - id: bachs
    main: ./cmd/bachs
    binary: bachs
    # CGO off so Linux builds are fully static: no glibc version to match,
    # which is what makes one binary work on Alpine, Debian and Amazon Linux.
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on ARM is not worth shipping until someone asks.
      - goos: windows
        goarch: arm64
    ldflags:
      # -s -w drops the symbol table and DWARF: ~9.4MB becomes ~6.3MB, and
      # nothing we support depends on either.
      - -s -w -X main.version={{.Version}}

archives:
  - id: bachs
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# Casks, not formulae: `brews` is deprecated because the formulae GoReleaser
# generated for pre-built binaries were never really formulae — a formula is
# meant to describe a build from source. A cask is the honest shape for
# shipping a compiled binary.
homebrew_casks:
  - name: bachs
    binaries:
      - bachs
    repository:
      owner: bachsdev
      name: homebrew-bachs
    homepage: https://bachs.io
    description: Forward live Bachs webhook events to your local machine
    hooks:
      post:
        # The binary is not notarised, so Gatekeeper quarantines anything
        # downloaded and macOS refuses to run it. Stripping the attribute is
        # what every unsigned cask does; signing it properly needs an Apple
        # Developer ID and is worth doing before this reaches many users.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/bachs"]
          end

nfpms:
  - id: bachs
    package_name: bachs
    homepage: https://bachs.io
    description: Forward live Bachs webhook events to your local machine
    maintainer: Bachs <support@bachs.io>
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

scoops:
  - repository:
      owner: bachsdev
      name: scoop-bachs
    homepage: https://bachs.io
    description: Forward live Bachs webhook events to your local machine
    license: MIT

# Docker is deliberately not wired up yet.
#
# `dockers` is being phased out for `dockers_v2`, which builds during publish
# and needs the Dockerfile reworked around $TARGETPLATFORM. That is a real
# change worth testing on its own rather than bundling into a first release,
# and a container is the least likely way anyone installs a local-testing CLI.
# The Dockerfile in this repo still builds by hand:
#   go build -o bachs ./cmd/bachs && docker build -t bachs .

release:
  # Draft so a human approves the notes before anything is public.
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
